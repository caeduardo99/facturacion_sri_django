{% extends "base.html" %}
{% block title %}Editar producto | FacturaEC{% endblock %}
{% block header_title %}Editar producto{% endblock %}
{% block content %}
<div class="mb-8"><a href="{% url 'productos:lista' %}" class="text-sm font-medium text-blue-600">← Volver a productos</a><h1 class="mt-4 text-3xl font-bold">Editar producto</h1></div>
<div class="max-w-4xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
{% if error %}<div class="mb-6 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="grid gap-5 md:grid-cols-2">
<div><label class="text-sm font-semibold">Código</label><input name="codigo" value="{{ producto.codigo }}" maxlength="50" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Código auxiliar</label><input name="codigo_auxiliar" value="{{ producto.codigo_auxiliar }}" maxlength="50" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Nombre</label><input name="nombre" value="{{ producto.nombre }}" maxlength="250" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Precio</label><input type="number" step="0.0001" min="0" name="precio" value="{{ producto.precio }}" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Porcentaje IVA</label><input type="number" step="0.01" min="0" name="porcentaje_iva" value="{{ producto.porcentaje_iva }}" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Stock</label><input type="number" step="0.0001" min="0" name="stock" value="{{ producto.stock }}" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div class="md:col-span-2"><label class="text-sm font-semibold">Descripción</label><textarea name="descripcion" rows="4" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3">{{ producto.descripcion }}</textarea></div>
</div>
<div class="mt-7 flex justify-end gap-3"><a href="{% url 'productos:lista' %}" class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-700">Cancelar</a><button class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white">Guardar cambios</button></div>
</form></div>
{% endblock %}
