{% extends "base.html" %}
{% block title %}Eliminar cliente | FacturaEC{% endblock %}
{% block header_title %}Eliminar cliente{% endblock %}
{% block content %}
<div class="max-w-lg rounded-2xl border border-red-100 bg-white p-7 shadow-sm">
<h1 class="text-2xl font-bold text-slate-900">Eliminar cliente</h1>
<p class="mt-3 text-slate-600">¿Deseas desactivar a <strong>{{ cliente.nombres }}</strong> ({{ cliente.identificacion }})?</p>
<form method="post" class="mt-7 flex justify-end gap-3">{% csrf_token %}<a href="{% url 'clientes:lista' %}" class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-700">Cancelar</a><button class="rounded-xl bg-red-600 px-6 py-3 font-semibold text-white hover:bg-red-700">Sí, eliminar</button></form>
</div>
{% endblock %}
