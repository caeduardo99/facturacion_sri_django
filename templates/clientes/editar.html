{% extends "base.html" %}
{% block title %}Editar cliente | FacturaEC{% endblock %}
{% block header_title %}Editar cliente{% endblock %}
{% block content %}
<div class="mb-8"><a href="{% url 'clientes:lista' %}" class="text-sm font-medium text-blue-600">← Volver a clientes</a><h1 class="mt-4 text-3xl font-bold text-slate-900">Editar cliente</h1></div>
<div class="max-w-4xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
{% if error %}<div class="mb-6 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="grid gap-5 md:grid-cols-2">
<div><label class="text-sm font-semibold">Tipo de identificación</label><select name="tipo_identificacion" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"><option value="05" {% if cliente.tipo_identificacion == "05" %}selected{% endif %}>Cédula</option><option value="04" {% if cliente.tipo_identificacion == "04" %}selected{% endif %}>RUC</option><option value="06" {% if cliente.tipo_identificacion == "06" %}selected{% endif %}>Pasaporte</option><option value="07" {% if cliente.tipo_identificacion == "07" %}selected{% endif %}>Consumidor final</option></select></div>
<div><label class="text-sm font-semibold">Identificación</label><input name="identificacion" value="{{ cliente.identificacion }}" maxlength="20" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div class="md:col-span-2"><label class="text-sm font-semibold">Nombres / Razón social</label><input name="nombres" value="{{ cliente.nombres }}" maxlength="250" required class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div class="md:col-span-2"><label class="text-sm font-semibold">Dirección</label><input name="direccion" value="{{ cliente.direccion }}" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Teléfono</label><input name="telefono" value="{{ cliente.telefono }}" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
<div><label class="text-sm font-semibold">Correo electrónico</label><input type="email" name="email" value="{{ cliente.email }}" class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"></div>
</div>
<div class="mt-7 flex justify-end gap-3"><a href="{% url 'clientes:lista' %}" class="rounded-xl border border-slate-300 px-6 py-3 font-semibold text-slate-700">Cancelar</a><button class="rounded-xl bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700">Guardar cambios</button></div>
</form></div>
{% endblock %}
