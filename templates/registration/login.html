<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Iniciar sesión | Facturación</title><link rel='stylesheet' href='/static/css/app.css'></head><body class='login-page'><main class='login-card'><div class='brand'>Factura<span>EC</span></div><h1>Iniciar sesión</h1><p>Ingresa a tu sistema de facturación electrónica.</p>{% if form.errors %}<div class='error'>Usuario o contraseña incorrectos.</div>{% endif %}<form method='post'>{% csrf_token %}<label>Usuario<input name='username' required autofocus></label><label>Contraseña<input type='password' name='password' required></label><button>Ingresar</button></form></main></body></html>
